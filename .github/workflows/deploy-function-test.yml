
name: Deploy Nordvik Test Function App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'examination/nordvik-function/**'
      - '.github/workflows/deploy-function-test.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: examination/nordvik-function
        run: npm ci --omit=dev

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-test841568
          package: examination/nordvik-function
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_TEST }}
