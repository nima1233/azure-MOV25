<!DOCTYPE html>

<html lang="sv">
<head>
    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 30px;
        background: #f5f6f8;
        color: #222;
    }

    h1 {
        margin-bottom: 5px;
    }

    h2 {
        margin-top: 30px;
    }

    button {
        padding: 8px 14px;
        margin: 5px 5px 5px 0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background: #2563eb;
        color: white;
    }

    button:hover {
        opacity: 0.9;
    }

    input,
    textarea,
    select {
        width: 100%;
        max-width: 600px;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    #reports-list > div {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
    }

    #reports-list img {
        max-width: 400px;
        max-height: 300px;
        object-fit: contain;
        border-radius: 5px;
        margin-top: 10px;
    }

    .edit-form {
        background: #f5f6f8;
        padding: 15px;
        margin-top: 15px;
        border-radius: 6px;
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordvik - Felanmälan</title>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.27.0/lib/msal-browser.min.js"></script>

</head>

<body>

<h1>Nordvik - Felanmälan</h1>

<div id="loginSection">
    <button id="loginButton">Logga in med Microsoft</button>
    <p id="userInfo"></p>
</div>

<div id="reportSection" style="display: none;">

    <p>
        Inloggad som: <strong id="userName"></strong>
    </p>

    <button id="logoutButton">Logga ut</button>

    <hr>

    <h2>Skapa felanmälan</h2>

    <form id="reportForm">

        <label for="title">Rubrik</label><br>
        <input type="text" id="title" name="title" required>
        <br><br>

        <label for="description">Beskrivning</label><br>
        <textarea id="description" name="description" required></textarea>
        <br><br>

        <label for="category">Kategori</label><br>
        <select id="category" name="category" required>
            <option value="">Välj kategori</option>
            <option value="Vatten">Vatten</option>
            <option value="Värme">Värme</option>
            <option value="Lås / Dörr">Lås / Dörr</option>
            <option value="Annat">Annat</option>
        </select>
        <br><br>

        <label for="image">Bild</label><br>
        <input type="file" id="image" name="image" accept="image/*" required>
        <br><br>

        <button type="submit">Skicka felanmälan</button>

        <p id="result"></p>

    </form>

    <section id="reports-section">
    <h2 id="reports-title">Ärenden</h2>

    <button onclick="loadReports()">Visa ärenden</button>

    <div id="reports-list">
        <p>Visar inga ärenden just nu.</p>
    </div>
    </section>

</div>

<script>

    const msalConfig = {
    auth: {
        clientId: "19641409-fcfe-4701-a5f2-257ffcffbdfa",
        authority: "https://login.microsoftonline.com/94f76439-7ed1-4b30-9de4-84beaf39b695",
        redirectUri: window.location.origin + "/redirect.html"
        }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    let accessToken = null;

    msalInstance.initialize().then(() => {
    console.log("MSAL initialized");
    });
    

    const loginButton = document.getElementById('loginButton');
    const logoutButton = document.getElementById('logoutButton');
    const loginSection = document.getElementById('loginSection');
    const reportSection = document.getElementById('reportSection');
    const userName = document.getElementById('userName');
    const result = document.getElementById('result');
    const form = document.getElementById('reportForm');

    loginButton.addEventListener('click', async () => {

        try {

            const loginResponse = await msalInstance.loginPopup({
                scopes: ["api://19641409-fcfe-4701-a5f2-257ffcffbdfa/access_as_user"],
                prompt: "select_account"
            });

            const account = loginResponse.account;

            msalInstance.setActiveAccount(account);

            const tokenResponse = await msalInstance.acquireTokenSilent({
                scopes: ["api://19641409-fcfe-4701-a5f2-257ffcffbdfa/access_as_user"],
                account: account
            });

            accessToken = tokenResponse.accessToken;

            await loadReports();

            const tokenPayload =
                JSON.parse(atob(accessToken.split('.')[1]));

            console.log("Token roles:", tokenPayload.roles);


            userName.textContent =
                account.name || account.username;

            loginSection.style.display = "none";
            reportSection.style.display = "block";

        }  catch (error) {

            console.error(error);

            document.getElementById('userInfo').textContent =
                "Inloggningen misslyckades.";

        }

    });

    logoutButton.addEventListener('click', async () => {

        accessToken = null;
        msalInstance.setActiveAccount(null);

        reportSection.style.display = "none";
        loginSection.style.display = "block";

        const reportsList = document.getElementById('reports-list');

        if (reportsList) {
            reportsList.innerHTML = '<p>Please log in to view reports.</p>';
        }

    });

    form.addEventListener('submit', async (event) => {

        event.preventDefault();

        const formData = new FormData(form);

        result.textContent = 'Skickar...';

        try {

            const response = await fetch(
                'https://func-test841568.azurewebsites.net/api/report',
                {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: formData
                }
            );

            const responseText = await response.text();

            console.log("Status:", response.status);
            console.log("Response:", responseText);

            let data;

            try {
                data = JSON.parse(responseText);
            } catch {
                result.textContent =
                    `Server returned ${response.status}: ${responseText}`;
                return;
            }

            if (data.success) {

                result.textContent =
                    `Felanmälan skickad. ID: ${data.reportId}`;

                form.reset();

            } else {

                result.textContent =
                    `Fel: ${data.error}`;

            }

        } catch (error) {

            result.textContent =
                `Fel vid anslutning: ${error.message}`;

        }

    });

async function loadReports() {
    try {

        const account = msalInstance.getActiveAccount();

        if (!account) {
            alert('Logga in först.');
            return;
        }

        const roles = account.idTokenClaims?.roles || [];

        const reportsTitle =
            document.getElementById('reports-title');

        const refreshButton = document.querySelector(
            '#reports-section button'
        );

        if (roles.includes('Manager')) {
            reportsTitle.textContent = 'Alla ärenden';
            refreshButton.textContent = 'Uppdatera alla ärenden';

        } else if (roles.includes('Finance')) {
            reportsTitle.textContent = 'Alla ärenden';
            refreshButton.textContent = 'Uppdatera alla ärenden';

        } else {
            reportsTitle.textContent = 'Mina ärenden';
            refreshButton.textContent = 'Uppdatera alla mina ärenden';
        }

        const response = await fetch(
            'https://func-test841568.azurewebsites.net/api/reports',
            {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            }
        );

        const data = await response.json();

        const reportsList = document.getElementById('reports-list');

        if (!data.success) {
            reportsList.innerHTML = '<p>Fel vid hämtning av ärenden.</p>';
            return;
        }

        if (data.reports.length === 0) {
            reportsList.innerHTML = '<p>Du har inga ärenden.</p>';
            return;
        }

        data.reports.sort(
            (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
        );

        reportsList.innerHTML = '';

        for (const report of data.reports) {

            const reportElement = document.createElement('div');

            reportElement.innerHTML = `
                <h3>${report.title}</h3>
                <p><strong>Beskrivning:</strong> ${report.description}</p>
                <p><strong>Kategori:</strong> ${report.category}</p>
                <p><strong>Inskickad:</strong> ${formatDate(report.createdAt)}</p>
                <p class="image-loading">Hämtar bild...</p>
            `;

            reportsList.appendChild(reportElement);

            if (roles.includes('Manager')) {

                const editButton = document.createElement('button');

                editButton.textContent = 'Ändra';

                editButton.onclick = () => {
                    showEditForm(report, reportElement);
                };

                reportElement.appendChild(editButton);
            }

            try {
                const imageResponse = await fetch(
                    `https://func-test841568.azurewebsites.net/api/report/${report.id}/image`,
                    {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`
                        }
                    }
                );

                if (imageResponse.ok) {
                    const imageBlob = await imageResponse.blob();
                    const imageUrl = URL.createObjectURL(imageBlob);

                    const loadingText =
                        reportElement.querySelector('.image-loading');

                    if (loadingText) {
                        loadingText.remove();
                    }

                    const image = document.createElement('img');

                    image.src = imageUrl;
                    image.alt = report.imageName || 'Report image';
                    image.style.maxWidth = '400px';
                    image.style.display = 'block';
                    image.style.marginBottom = '15px';

                    reportElement.appendChild(image);

                } else {
                    console.error(
                        'Could not load image:',
                        imageResponse.status
                    );
                }

            } catch (error) {
                console.error(
                    'Error loading report image:',
                    error
                );
            }
        }

    } catch (error) {
        console.error(error);

        document.getElementById('reports-list').innerHTML =
            '<p>Error loading reports.</p>';
    }

function formatDate(dateString) {
    return new Date(dateString).toLocaleString('sv-SE', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

}

function showEditForm(report, reportElement) {

    if (reportElement.querySelector('.edit-form')) {
        return;
    }

    const form = document.createElement('div');
    form.className = 'edit-form';

    form.innerHTML = `
        <div>
            <label>
                Rubrik:
                <input type="text" id="edit-title-${report.id}"
                    value="${report.title}">
            </label>
        </div>

        <div>
            <label>
                Beskrivning:
                <textarea id="edit-description-${report.id}">${report.description}</textarea>
            </label>
        </div>

        <div>
            <label>
                Kategori:
                <select id="edit-category-${report.id}">
                    <option value="Vatten">Vatten</option>
                    <option value="Värme">Värme</option>
                    <option value="Lås / Dörr">Lås / Dörr</option>
                    <option value="Annat">Annat</option>
                </select>
            </label>
        </div>

        <button onclick="saveReport('${report.id}', this)">
            Save
        </button>

        <button onclick="this.parentElement.remove()">
            Cancel
        </button>
    `;

    reportElement.appendChild(form);

    document.getElementById(
        `edit-category-${report.id}`
    ).value = report.category;
}

async function saveReport(reportId, button) {
    try {
        const title =
            document.getElementById(`edit-title-${reportId}`).value;

        const description =
            document.getElementById(`edit-description-${reportId}`).value;

        const category =
            document.getElementById(`edit-category-${reportId}`).value;

        const response = await fetch(
            `https://func-test841568.azurewebsites.net/api/report/${reportId}`,
            {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: title,
                    description: description,
                    category: category
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || 'Kunde inte uppdatera ärende.');
            return;
        }

        alert('Ärende uppdaterad.');

        // Reload reports so the updated values are displayed
        await loadReports();

    } catch (error) {
        console.error(error);
        alert('Fel vid uppdatering av ärenden: ' + error.message);
    }
}

</script>

</body>
</html>
