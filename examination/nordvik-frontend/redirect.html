<!DOCTYPE html>
<html>
<head>
    <title>Authentication</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.27.0/lib/msal-browser.min.js"></script>

    <script>
        const CLIENT_ID = "f0cf0269-845e-4db1-af23-43dd6fce718d";
        const TENANT_ID = "94f76439-7ed1-4b30-9de4-84beaf39b695";

        const msalInstance = new msal.PublicClientApplication({
            auth: {
                clientId: CLIENT_ID,
                authority: `https://login.microsoftonline.com/${TENANT_ID}`,
                redirectUri: window.location.href
            }
        });

        msalInstance.initialize().then(() => {
            msalInstance.handleRedirectPromise();
        });
    </script>
</body>
</html>
